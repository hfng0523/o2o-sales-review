<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O2O 銷售檢討</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
:root{
  color-scheme: light;
  --bg:#f4f4f2; --surface:#fcfcfb; --surface-2:#f0efec; --surface-3:#e8e7e3; --border:#e2e1dc;
  --text:#0b0b0b; --text-2:#52514e; --muted:#83827c;
  --accent:#2a78d6; --accent-ink:#1c5cab; --accent-soft:#e3eefb;
  --pos:#0a7d0a; --neg:#c62f2f; --pos-soft:#e5f4e5; --neg-soft:#fbe6e6;
  --cmp:#a3a29b; --warn-bg:#fff4d6; --warn-ink:#7a5000; --hol:rgba(237,161,0,.16);
  --hm-mid:#f0efec; --hm-pos:#1c5cab; --hm-neg:#d03b3b;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#111110; --surface:#1a1a19; --surface-2:#232321; --surface-3:#2d2d2a; --border:#33332f;
    --text:#f0efec; --text-2:#c3c2b7; --muted:#8f8e86;
    --accent:#3987e5; --accent-ink:#86b6ef; --accent-soft:#1b2b40;
    --pos:#4fd14f; --neg:#ef7a7a; --pos-soft:#17301a; --neg-soft:#3a1c1c;
    --cmp:#6f6e68; --warn-bg:#3a2f12; --warn-ink:#f5c35a; --hol:rgba(237,161,0,.14);
    --hm-mid:#383835; --hm-pos:#3987e5; --hm-neg:#e66767;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#111110; --surface:#1a1a19; --surface-2:#232321; --surface-3:#2d2d2a; --border:#33332f;
  --text:#f0efec; --text-2:#c3c2b7; --muted:#8f8e86;
  --accent:#3987e5; --accent-ink:#86b6ef; --accent-soft:#1b2b40;
  --pos:#4fd14f; --neg:#ef7a7a; --pos-soft:#17301a; --neg-soft:#3a1c1c;
  --cmp:#6f6e68; --warn-bg:#3a2f12; --warn-ink:#f5c35a; --hol:rgba(237,161,0,.14);
  --hm-mid:#383835; --hm-pos:#3987e5; --hm-neg:#e66767;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang HK","Microsoft JhengHei","Noto Sans HK",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.nums,td.n,.kv{font-variant-numeric:tabular-nums}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px 48px}

/* header */
header.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--border)}
.top-in{max-width:1320px;margin:0 auto;padding:12px 20px 0;display:flex;flex-direction:column;gap:10px}
.row1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand small{font-weight:500;color:var(--muted);font-size:12px}
.health{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:3px 10px;cursor:pointer}
.health .dot{width:7px;height:7px;border-radius:50%;background:#eda100}
.health .dot.ok{background:#0ca30c}
.sp{flex:1}
.iconbtn{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:8px 12px 10px;cursor:pointer;color:var(--text-2);font-weight:600;font-size:14px;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}

/* context bar */
.ctx{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 0 4px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;white-space:nowrap;max-width:100%}
.chip .lb{color:var(--muted)}
.chip b{font-weight:600}
.chip:hover{border-color:var(--text-2)}
.chip.set{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.chip.set .lb{color:var(--accent-ink);opacity:.8}
.chip.dis{opacity:.45;cursor:not-allowed}
.chip .x{margin-left:2px;border:0;background:none;cursor:pointer;color:inherit;padding:0 2px;font-size:14px;line-height:1}
.chip.ghost{background:none;border-style:dashed}
.crumbs{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap;padding:2px 0 6px}
.crumbs a{color:var(--accent-ink);cursor:pointer;text-decoration:none}
.crumbs a:hover{text-decoration:underline}

/* popover */
#pop{position:absolute;z-index:60;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:14px;min-width:260px;max-width:min(380px,calc(100vw - 24px));display:none}
#pop h4{margin:0 0 8px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
#pop .opts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.opt{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px}
.opt:hover{background:var(--surface-2)}
.opt.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt:disabled{opacity:.4;cursor:not-allowed}
#pop label.ck{display:flex;align-items:center;gap:8px;padding:5px 4px;cursor:pointer;border-radius:6px;font-size:13px}
#pop label.ck:hover{background:var(--surface-2)}
#pop .list{max-height:280px;overflow:auto;margin:6px -4px}
#pop input[type=date],#pop input[type=search]{border:1px solid var(--border);background:var(--surface-2);border-radius:8px;padding:5px 8px;width:100%}
#pop .drow{display:flex;gap:8px;align-items:center}
#pop .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
#pop .note{font-size:12px;color:var(--muted);margin-top:6px}

/* layout */
main{padding-top:14px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;min-width:0}
.card h3{margin:0;font-size:15px;font-weight:700;letter-spacing:-.005em}
.card .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card .hd .sub{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
@media (max-width:960px){.grid2{grid-template-columns:1fr}}

/* insight */
.insight{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.65}
.insight .ic{font-size:20px;line-height:1.3}
.insight p{margin:0}
.insight .warns{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.warn{font-size:12.5px;background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;padding:5px 10px}
.warn button{border:0;background:none;color:inherit;text-decoration:underline;cursor:pointer;font-weight:600;padding:0 2px}
.up{color:var(--pos)} .dn{color:var(--neg)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;cursor:pointer;text-align:left;position:relative;box-shadow:var(--shadow);min-width:0}
.kpi:hover{border-color:var(--text-2)}
.kpi.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.kpi .k{font-size:12px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;gap:6px}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:4px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .d{font-size:13px;font-weight:600}
.kpi .b{font-size:12px;color:var(--muted);margin-top:2px}
.kpi .gear{border:0;background:var(--surface-2);border-radius:6px;padding:1px 7px;font-size:11px;cursor:pointer;color:var(--text-2)}
.kpi .na{font-size:12px;color:var(--warn-ink);background:var(--warn-bg);border-radius:6px;padding:2px 6px;display:inline-block;margin-top:4px}

/* controls */
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:4px 10px;border-radius:7px;cursor:pointer;font-size:12.5px;color:var(--text-2);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
select.sel{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:4px 8px;font-size:13px}
.lbl{font-size:12px;color:var(--muted)}
.chartbox{position:relative;height:300px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--text-2);flex-wrap:wrap}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid var(--accent);vertical-align:middle;margin-right:6px}
.legend i.c{border-top:2px dashed var(--cmp)}
.legend i.h{height:10px;border:0;background:var(--hol);width:12px}

/* bar list */
.bl{display:flex;flex-direction:column}
.bl .r{display:grid;grid-template-columns:minmax(90px,1.2fr) 86px minmax(120px,1.6fr) 74px;gap:10px;align-items:center;padding:7px 6px;border-radius:8px;cursor:pointer;font-size:13px}
.bl .r:hover{background:var(--surface-2)}
.bl .r.sel{background:var(--accent-soft)}
.bl .r.nodrill{cursor:default}
.bl .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bl .nm small{color:var(--muted);margin-left:4px}
.bl .cv{text-align:right;color:var(--text-2)}
.bl .bar{position:relative;height:18px}
.bl .bar .axis{position:absolute;left:50%;top:-3px;bottom:-3px;border-left:1px solid var(--border)}
.bl .bar .f{position:absolute;top:3px;height:12px;border-radius:3px}
.bl .bar .f.p{background:var(--pos);left:50%;border-radius:0 4px 4px 0}
.bl .bar .f.n{background:var(--neg);right:50%;border-radius:4px 0 0 4px}
.bl .dv{text-align:right;font-weight:600}
.bl .hdr{cursor:default;font-size:11.5px;color:var(--muted);font-weight:600}
.bl .hdr:hover{background:none}
.more{margin-top:8px;border:0;background:none;color:var(--accent-ink);cursor:pointer;font-size:13px;padding:4px}
@media (max-width:560px){.bl .r{grid-template-columns:minmax(80px,1fr) minmax(70px,1fr) 64px}.bl .cv{display:none}}

/* movers */
.mv{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.mv{grid-template-columns:1fr}}
.mv h4{margin:0 0 6px;font-size:12.5px;font-weight:700}
.mv ol{list-style:none;margin:0;padding:0}
.mv li{display:flex;justify-content:space-between;gap:8px;padding:6px 6px;border-radius:8px;cursor:pointer;font-size:13px}
.mv li:hover{background:var(--surface-2)}
.mv li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mv li b{white-space:nowrap}
.mv .rk{display:inline-block;width:18px;color:var(--muted);font-size:12px}

/* table */
details.det>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px}
details.det>summary::-webkit-details-marker{display:none}
details.det>summary .chev{transition:transform .15s;color:var(--muted)}
details.det[open]>summary .chev{transform:rotate(90deg)}
.tblwrap{overflow:auto;max-height:560px;margin-top:12px;border:1px solid var(--border);border-radius:10px}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{padding:7px 10px;border-bottom:1px solid var(--border);white-space:nowrap;text-align:right}
table.t th{position:sticky;top:0;background:var(--surface-2);font-weight:600;font-size:12px;color:var(--text-2);cursor:pointer;user-select:none;z-index:1}
table.t th.l,table.t td.l{text-align:left}
table.t tbody tr:hover{background:var(--surface-2)}
table.t tbody tr.click{cursor:pointer}
table.t tfoot td{font-weight:700;background:var(--surface-2);position:sticky;bottom:0}
input.search{border:1px solid var(--border);background:var(--surface-2);border-radius:8px;padding:5px 10px;font-size:13px;min-width:180px}

/* heatmap */
.hm{border-collapse:separate;border-spacing:3px;font-size:12.5px;min-width:100%}
.hm th{font-weight:600;color:var(--muted);font-size:11.5px;padding:4px 2px;white-space:nowrap;text-align:center}
.hm th.pn{text-align:left;padding-left:6px}
.hm td{text-align:center;padding:0;border-radius:6px;height:38px;min-width:54px;cursor:pointer;font-variant-numeric:tabular-nums;font-weight:600}
.hm td.pn{background:none;text-align:left;cursor:pointer;font-weight:600;padding:0 10px 0 6px;white-space:nowrap;min-width:200px}
.hm tr.sel td.pn{color:var(--accent-ink)}
.hm td.na{background:repeating-linear-gradient(45deg,var(--surface-2),var(--surface-2) 4px,var(--surface-3) 4px,var(--surface-3) 8px);color:var(--muted);font-weight:400}
.hm td.avg{outline:1px solid var(--border)}
.hm tr.sel td:not(.pn):not(.emp){box-shadow:0 0 0 2px var(--accent) inset}
.hmlegend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.hmlegend .grad{width:160px;height:10px;border-radius:5px}

/* promo detail tables */
.pstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.pstat{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.pstat .k{font-size:12px;color:var(--muted)}
.pstat .v{font-size:20px;font-weight:700}
table.xl{border-collapse:collapse;font-size:12.5px;width:100%}
table.xl th,table.xl td{padding:6px 9px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
table.xl th{background:var(--surface-2);color:var(--text-2);font-weight:600;font-size:11.5px;position:sticky;top:0}
table.xl td.m,table.xl th.m{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;font-weight:600}
table.xl th.m{background:var(--surface-2);z-index:2}
table.xl tr.hl td{background:var(--accent-soft)}
table.xl tr.hl td.m{background:var(--accent-soft)}
table.xl td.bf{color:var(--text-2);background:var(--surface-2)}
table.xl td.av{font-weight:700;border-left:2px solid var(--border)}
table.xl td.neg{color:var(--neg)}
table.xl tr.txt td{color:var(--muted);font-size:11px;font-weight:400}
.xlwrap{overflow:auto;border:1px solid var(--border);border-radius:10px;margin-bottom:14px}
.subt{font-size:13px;font-weight:700;margin:6px 0 8px}
.note{font-size:12px;color:var(--muted);margin-top:6px}

/* drawer */
#drawer{position:fixed;inset:0 0 0 auto;width:min(460px,100vw);background:var(--surface);border-left:1px solid var(--border);z-index:80;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.15)}
#drawer.open{transform:none}
#drawer .dh{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
#drawer .db{padding:12px 18px;overflow:auto;flex:1}
#drawer .df{padding:12px 18px;border-top:1px solid var(--border);font-size:13px;color:var(--text-2)}
.rl{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--border);cursor:pointer;font-size:13px}
.rl:hover{background:var(--surface-2)}
.rl .tag{font-size:10.5px;color:var(--muted);display:block}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:70;display:none}
#scrim.on{display:block}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}
.empty{color:var(--muted);font-size:13px;padding:18px;text-align:center}
.hide{display:none!important}
footer{color:var(--muted);font-size:12px;margin-top:20px;line-height:1.7}
@media (max-width:640px){
  .wrap,.top-in{padding-left:16px;padding-right:16px}
  .kpi .v{font-size:23px}
  .brand small{display:none}
  .row1 .iconbtn .t{display:none}
  .chartbox{height:240px}
}
@media print{header.top{position:static}.iconbtn,.tabs,#pop{display:none!important}}
</style>

<style>
body.locked > *:not(#loginGate){display:none!important}
#loginGate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f4f4f2;z-index:99999;font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif}
#loginGate .lg{background:#fff;padding:30px 28px;border-radius:16px;box-shadow:0 12px 44px rgba(0,0,0,.14);width:300px;text-align:center}
#loginGate .lg-t{font-size:19px;font-weight:700;margin-bottom:4px;color:#0b0b0b}
#loginGate .lg-s{color:#83827c;font-size:12.5px;margin-bottom:18px}
#loginGate input{width:100%;padding:11px 12px;border:1px solid #ddd;border-radius:9px;margin-bottom:10px;box-sizing:border-box;font-size:14px;outline:none}
#loginGate input:focus{border-color:#2a78d6}
#loginGate button{width:100%;padding:11px;border:0;border-radius:9px;background:#2a78d6;color:#fff;font-weight:700;cursor:pointer;font-size:14px}
#loginGate button:hover{background:#1c5cab}
#err{color:#c62f2f;font-size:12px;height:15px;margin-bottom:4px}
</style>
</head>
<body class="locked"><div id="loginGate"><div class="lg"><div class="lg-t">🔒 O2O 銷售檢討</div>
<div class="lg-s">請輸入密碼</div>
<input id="pw" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')unlock()">
<div id="err"></div><button onclick="unlock()">解鎖</button></div></div>

<header class="top">
  <div class="top-in">
    <div class="row1">
      <div class="brand">📊 O2O 銷售檢討 <small>v4</small></div>
      <button class="health" id="health" title="數據更新情況"><span class="dot" id="hdot"></span><span id="htxt"></span></button>
      <span class="sp"></span>
      <button class="iconbtn" id="bSave" title="儲存目前視圖">⭐ <span class="t">儲存視圖</span></button>
      <button class="iconbtn" id="bViews" title="已儲存視圖">📂 <span class="t">我的視圖</span></button>
      <button class="iconbtn" id="bLink" title="複製連結（包含目前篩選）">🔗 <span class="t">複製連結</span></button>
      <button class="iconbtn" id="bXls" title="匯出目前畫面">📥 <span class="t">匯出 Excel</span></button>
      <button class="iconbtn" id="bTheme" title="深色／淺色">🌓</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<div class="wrap">
  <div id="ctxArea">
    <div class="ctx" id="ctx"></div>
    <div class="crumbs" id="crumbs"></div>
  </div>
  <main id="main">
    <section class="card" id="secInsight"></section>
    <section class="kpis" id="secKpi"></section>
    <section class="card" id="secTrend">
      <div class="hd"><h3 id="trendTitle">每日走勢</h3><span class="sub" id="trendSub"></span><span class="sp" style="flex:1"></span>
        <div class="legend"><span><i></i>本期</span><span><i class="c"></i>比較期</span><span><i class="h"></i>節日／節前</span></div></div>
      <div class="chartbox"><canvas id="chart"></canvas></div>
      <div class="note">撳圖上任何一日，即可下鑽睇嗰日。</div>
    </section>
    <div class="grid2" id="secBreakRow">
      <section class="card" id="secBreak"></section>
      <section class="card" id="secMovers"></section>
    </div>
    <section class="card" id="secDetail"></section>
    <section class="card hide" id="secPromo"></section>
    <section class="card hide" id="secPromoDetail"></section>
  </main>
  <footer id="foot"></footer>

<script type="text/plain" id="appjs">
/* =====================================================================
   O2O 銷售檢討 v4
   - 數據：D（每日 品類／會員／門市）、DR（Discount rule 每日 Cost）、XL（7 個 promo review）、FRESH
   - 所有日期計算用 UTC，避免香港時區偏差一日
   ===================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N = D.days.length;
const ISO = D.days.map(d => d.iso);
const IDX = Object.fromEntries(ISO.map((d, i) => [d, i]));
const WD = ['一','二','三','四','五','六','日'];
const CATS = D.cats.filter(c => c !== 'All');
const MEMS = D.memberships.slice();

/* ---------- 節日／特別日子（可自行修改）----------
   ex:true = 「比較基準避開節日」時會跳過呢日，改用再早一星期 */
const EVENTS = [
  {d:'2026-06-19', n:'端午節', ex:true},
  {d:'2026-07-01', n:'回歸紀念日', ex:true},
  {d:'2026-09-24', n:'中秋節前', ex:true},
  {d:'2026-09-25', n:'中秋節', ex:true},
  {d:'2026-09-26', n:'中秋節翌日', ex:true},
  {d:'2026-10-01', n:'國慶日', ex:true},
];
const EVM = Object.fromEntries(EVENTS.map(e => [e.d, e]));
const isEx = i => !!(EVM[ISO[i]] && EVM[ISO[i]].ex);

/* ---------- 日期工具（UTC，唔受時區影響）---------- */
function addDays(iso, n){ const [y,m,d] = iso.split('-').map(Number); return new Date(Date.UTC(y, m-1, d+n)).toISOString().slice(0,10); }
function dayDiff(a, b){ const p = s => { const [y,m,d] = s.split('-').map(Number); return Date.UTC(y,m-1,d); }; return Math.round((p(b)-p(a))/864e5); }
function wdOf(iso){ const [y,m,d] = iso.split('-').map(Number); return (new Date(Date.UTC(y,m-1,d)).getUTCDay()+6)%7; }
const dm = iso => { const [,m,d] = iso.split('-'); return (+d)+'/'+(+m); };
const dmw = iso => dm(iso)+'（'+WD[wdOf(iso)]+'）';
const FIRST = ISO[0], LAST = ISO[N-1];
const clampIso = s => (!s || s < FIRST) ? FIRST : (s > LAST ? LAST : s);

/* ---------- 門市每日（密集陣列）---------- */
const SG = D.shops.map(() => new Float64Array(N)), SO = D.shops.map(() => new Float64Array(N));
D.shop_day.forEach(([s, d, g, o]) => { SG[s][d] += g; SO[s][d] += o; });
const SC = D.shops.map(() => new Float64Array(N)); const SC_DAYS = new Set();
D.shop_cost.forEach(([s, d, c]) => { SC[s][d] += c; SC_DAYS.add(d); });
const SC_FROM = SC_DAYS.size ? ISO[Math.min(...SC_DAYS)] : null;
const AMS = [...new Set(D.shops.map(s => s.am || '(未設定)'))].sort();
const DMS = [...new Set(D.shops.map(s => s.dm || '(未設定)'))].sort();

/* ---------- Discount Cost ---------- */
const RULE_LABELS = ['RM_DISCOUNT_ORDER_LEVEL', 'PROMOTION'];
const RULES = Object.keys(DR.rules).filter(k => RULE_LABELS.includes(DR.rules[k].label));
const DR_MISS = new Set(DR.meta.missing_days || []);
const costCovered = i => ISO[i] >= DR.meta.from && ISO[i] <= DR.meta.to && !DR_MISS.has(ISO[i]);
let _cKey = null, _cArr = null;
function costDay(){
  const sel = S.discSel || RULES, key = sel.length + ':' + sel.join('|');
  if (key === _cKey) return _cArr;
  const a = new Float64Array(N);
  sel.forEach(r => { const bd = (DR.rules[r] || {}).by_day || {}; for (const d in bd){ const i = IDX[d]; if (i != null) a[i] += bd[d]; } });
  _cKey = key; _cArr = a; return a;
}

/* ---------- 狀態 ---------- */
const LS = 'o2o_v4_state', LSV = 'o2o_v4_views';
const VIEWS = [
  {k:'overview', n:'總覽', dim:'cat'},
  {k:'promo',    n:'Promo 成效'},
  {k:'shop',     n:'門市', dim:'shop'},
  {k:'cat',      n:'品類', dim:'cat'},
  {k:'mem',      n:'會員', dim:'mem'},
  {k:'custom',   n:'自訂'},
];
function defState(){
  return { v:4, view:'overview',
    per:{from:addDays(LAST,-6), to:LAST}, cmp:{mode:'prev', from:null}, exHol:true,
    wds:[0,1,2,3,4,5,6], slice:{type:null, vals:[]}, scope:{type:null, vals:[]},
    metric:'gmv', dim:'cat', rankBy:'abs', showAll:false,
    discSel:null, promo:null, pMetric:'roi', pBase:'A', stack:[], sort:{k:'diff', dir:-1} };
}
function sanitize(s){
  const d = defState(); s = Object.assign(d, s || {});
  s.per.from = clampIso(s.per.from); s.per.to = clampIso(s.per.to);
  if (s.per.from > s.per.to) [s.per.from, s.per.to] = [s.per.to, s.per.from];
  if (!['prev','avg4','custom'].includes(s.cmp.mode)) s.cmp.mode = 'prev';
  if (s.cmp.mode === 'custom') s.cmp.from = clampIso(s.cmp.from || addDays(s.per.from, -7));
  if (!Array.isArray(s.wds) || !s.wds.length) s.wds = [0,1,2,3,4,5,6];
  if (!VIEWS.find(v => v.k === s.view)) s.view = 'overview';
  if (Array.isArray(s.discSel)) s.discSel = s.discSel.filter(k => RULES.includes(k));
  if (!Array.isArray(s.stack)) s.stack = [];
  return s;
}
function loadState(){
  try { const h = location.hash.match(/s=([^&]+)/); if (h) return sanitize(JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(h[1])))))); } catch(e){}
  try { const r = JSON.parse(localStorage.getItem(LS)); if (r && r.v === 4) return sanitize(r); } catch(e){}
  return defState();
}
let S = loadState();
const save = () => { try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e){} };
const shareable = () => { const c = JSON.parse(JSON.stringify(S)); c.stack = []; return c; };

/* ---------- 格式 ---------- */
const nf = (v, d=0) => Number(v).toLocaleString('en-US', {minimumFractionDigits:d, maximumFractionDigits:d});
function money(v, short){
  if (v == null || !isFinite(v)) return '—';
  const s = v < 0 ? '-' : '', a = Math.abs(v);
  if (short){
    if (a >= 1e6) return s+'$'+(a/1e6).toFixed(a >= 1e7 ? 1 : 2)+'M';
    if (a >= 1e4) return s+'$'+(a/1e3).toFixed(a >= 1e5 ? 0 : 1)+'K';
  }
  return s+'$'+nf(Math.round(a));
}
function intf(v, short){
  if (v == null || !isFinite(v)) return '—';
  const s = v < 0 ? '-' : '', a = Math.abs(v);
  if (short && a >= 1e5) return s+(a/1e3).toFixed(0)+'K';
  if (short && a >= 1e4) return s+(a/1e3).toFixed(1)+'K';
  return s+nf(Math.round(a));
}
const pct = (v, d=1) => (v == null || !isFinite(v)) ? '—' : (v > 0 ? '+' : '')+(v*100).toFixed(d)+'%';
const sgn = (v, f) => (v > 0 ? '+' : '') + f(v);
const cls = v => v > 0 ? 'up' : v < 0 ? 'dn' : '';
const arrow = v => v > 0 ? '▲' : v < 0 ? '▼' : '•';
const METRICS = {
  gmv:   {n:'GMV',    f:(v,s)=>money(v,s)},
  ord:   {n:'訂單數', f:(v,s)=>intf(v,s)},
  basket:{n:'客單價', f:(v)=>money(v)},
  cost:  {n:'Discount Cost', f:(v,s)=>money(v,s)},
  roi:   {n:'ROI', f:(v)=> v==null||!isFinite(v) ? '—' : v.toFixed(2)+'x'},
};
const DIMS = {cat:'品類', mem:'會員', shop:'門市', am:'AM', dm:'DM', wd:'星期'};

/* ---------- 計算核心 ---------- */
function perDays(){
  const a = IDX[S.per.from], b = IDX[S.per.to], r = [];
  for (let i = a; i <= b; i++) if (S.wds.includes(D.days[i].wd)) r.push(i);
  return r;
}
const perLen = () => dayDiff(S.per.from, S.per.to) + 1;
const step = () => Math.ceil(perLen()/7)*7;
function cmpIdx(i){
  const ok = j => j >= 0 && j < N && !(S.exHol && isEx(j));
  const back = j => { let t = 0; while (S.exHol && j >= 0 && isEx(j) && t < 4){ j -= 7; t++; } return j; };
  if (S.cmp.mode === 'avg4'){
    const s = step(), r = [];
    for (let k = 1; k <= 4; k++){ const j = i - s*k; if (ok(j)) r.push(j); }
    return r;
  }
  const off = S.cmp.mode === 'custom' ? dayDiff(S.cmp.from, S.per.from) : step();
  const j = back(i - off);
  return ok(j) ? [j] : [];
}
function cmpRangeText(){
  if (S.cmp.mode === 'custom'){ const f = S.cmp.from, t = addDays(f, perLen()-1); return dm(f)+'–'+dm(t); }
  const s = step();
  if (S.cmp.mode === 'avg4'){ const f = addDays(S.per.from, -4*s), k = Math.min(4, Math.floor(dayDiff(FIRST, S.per.from)/s)); return k <= 0 ? '冇數據' : dm(f < FIRST ? addDays(S.per.from, -k*s) : f)+'–'+dm(addDays(S.per.to, -s))+(k < 4 ? '，只有 '+k+' 期' : ''); }
  return dm(addDays(S.per.from, -s))+'–'+dm(addDays(S.per.to, -s));
}
const cmpName = () => ({prev:'上一期', avg4:'前 4 期平均', custom:'自訂比較期'})[S.cmp.mode];

function shopsInScope(){
  const all = D.shops.map((_, i) => i);
  if (!S.scope.type || !S.scope.vals.length) return all;
  const v = new Set(S.scope.vals), t = S.scope.type;
  return all.filter(i => t === 'shop' ? v.has(D.shops[i].code) : v.has(D.shops[i][t] || '(未設定)'));
}
function sumArrays(list){
  const g = new Float64Array(N), o = new Float64Array(N);
  list.forEach(([G, O]) => { for (let i = 0; i < N; i++){ g[i] += G[i]; o[i] += O[i]; } });
  return {g, o};
}
function series(){
  if (S.scope.type && S.scope.vals.length) return sumArrays(shopsInScope().map(i => [SG[i], SO[i]]));
  if (S.slice.type === 'cat' && S.slice.vals.length) return sumArrays(S.slice.vals.map(c => [D.cat_day[c].gmv, D.cat_day[c].ord]));
  if (S.slice.type === 'mem' && S.slice.vals.length) return sumArrays(S.slice.vals.map(m => [D.mem_day[m].gmv, D.mem_day[m].ord]));
  return {g: D.cat_day.All.gmv, o: D.cat_day.All.ord};
}
/* 總數：本期全期 + 可比較日子（本期 vs 比較期逐日對齊） */
function tot(G, O, days, CM){
  let g=0, o=0, gc=0, oc=0, bg=0, bo=0, nc=0, zb=0, zc=0;
  days.forEach(i => {
    g += G[i]; o += O[i];
    const js = CM[i];
    if (js.length){ nc++; gc += G[i]; oc += O[i]; let sg=0, so=0; js.forEach(j => { sg += G[j]; so += O[j]; if (G[j] <= 0 && G[i] > 0) zb++; }); bg += sg/js.length; bo += so/js.length; if (G[i] <= 0 && sg > 0) zc++; }
  });
  return {g, o, gc, oc, bg, bo, n:days.length, nc, zb, zc, partial: zb > 0 || zc > 0};
}
function mval(t, m){
  if (m === 'ord') return {cur:t.o, a:t.oc, b:t.bo};
  if (m === 'basket') return {cur:t.o ? t.g/t.o : null, a:t.oc ? t.gc/t.oc : null, b:t.bo ? t.bg/t.bo : null};
  return {cur:t.g, a:t.gc, b:t.bg};
}
function withDiff(v){ v.diff = (v.a != null && v.b != null) ? v.a - v.b : null; v.pct = v.b ? v.diff / v.b : null; return v; }
const filtered = () => !!((S.slice.type && S.slice.vals.length) || (S.scope.type && S.scope.vals.length));

function compute(){
  const days = perDays(), CM = {};
  days.forEach(i => CM[i] = cmpIdx(i));
  const ser = series(), t = tot(ser.g, ser.o, days, CM);
  // Cost / ROI（rule 層面，全公司）
  const C = costDay(), G0 = D.cat_day.All.gmv;
  let cost = 0, costB = 0, nCov = 0, dRoi = 0, cRoi = 0, nCovB = 0;
  days.forEach(i => {
    if (costCovered(i)){ nCov++; cost += C[i];
      const js = CM[i]; if (js.length){ let sg = 0; js.forEach(j => sg += G0[j]); dRoi += G0[i] - sg/js.length; cRoi += C[i]; } }
    const js = costCovered(i) ? CM[i].filter(costCovered) : []; if (js.length){ nCovB++; let sc = 0; js.forEach(j => sc += C[j]); costB += sc/js.length; }
  });
  const roi = (!filtered() && cRoi > 0) ? dRoi / cRoi : null;
  // 比較期係咪包含節日
  const cmpEv = new Set(), perEv = [], shifted = new Set();
  days.forEach(i => {
    if (EVM[ISO[i]]) perEv.push(ISO[i]);
    CM[i].forEach(j => { if (EVM[ISO[j]]) cmpEv.add(ISO[j]); });
    if (S.exHol && S.cmp.mode !== 'avg4'){ const off = S.cmp.mode === 'custom' ? dayDiff(S.cmp.from, S.per.from) : step(); const j = i - off; if (j >= 0 && isEx(j)) shifted.add(ISO[j]); }
    if (S.exHol && S.cmp.mode === 'avg4'){ const s = step(); for (let k = 1; k <= 4; k++){ const j = i - s*k; if (j >= 0 && isEx(j)) shifted.add(ISO[j]); } }
  });
  return {days, CM, ser, t, cost, costB, nCov, nCovB, roi, cRoi, perEv, cmpEv:[...cmpEv], shifted:[...shifted]};
}

/* ---------- 維度拆解 ---------- */
function dimAvail(d){
  const sc = !!(S.scope.type && S.scope.vals.length), sl = S.slice.type && S.slice.vals.length ? S.slice.type : null;
  if (d === 'cat') return sc ? '門市數據冇品類拆分' : sl === 'mem' ? '會員數據冇品類拆分' : '';
  if (d === 'mem') return sc ? '門市數據冇會員拆分' : sl === 'cat' ? '品類數據冇會員拆分' : '';
  if (['shop','am','dm'].includes(d)) return sl ? '門市數據冇品類／會員拆分' : '';
  return '';
}
function effDim(){
  if (!dimAvail(S.dim)) return S.dim;
  return ['cat','mem','shop','wd'].find(d => !dimAvail(d));
}
function dimRows(dim, X){
  const days = X.days, CM = X.CM;
  const mk = (key, name, sub, G, O, extra) => Object.assign({key, name, sub, t: tot(G, O, days, CM)}, extra || {});
  if (dim === 'cat') return CATS.map(c => mk(c, c, '', D.cat_day[c].gmv, D.cat_day[c].ord));
  if (dim === 'mem') return MEMS.map(m => mk(m, m, '', D.mem_day[m].gmv, D.mem_day[m].ord));
  if (dim === 'shop') return shopsInScope().map(i => { const s = D.shops[i];
    let c = null; days.forEach(d => { if (SC_DAYS.has(d)) c = (c||0) + SC[i][d]; });
    const r = mk(s.code, s.name, s.code, SG[i], SO[i], {am:s.am, dm:s.dm, cost:c}); r.partial = r.t.partial; return r; });
  if (dim === 'am' || dim === 'dm'){
    const groups = {};
    shopsInScope().forEach(i => { const k = D.shops[i][dim] || '(未設定)'; (groups[k] = groups[k] || []).push(i); });
    return Object.entries(groups).map(([k, list]) => { const s = sumArrays(list.map(i => [SG[i], SO[i]]));
      return mk(k, k, list.length+' 間', s.g, s.o, {n:list.length}); });
  }
  if (dim === 'wd'){
    const ser = X.ser;
    return [0,1,2,3,4,5,6].filter(w => S.wds.includes(w)).map(w => {
      const dd = days.filter(i => D.days[i].wd === w);
      return Object.assign({key:String(w), name:'星期'+WD[w], sub:dd.length+' 日', t: tot(ser.g, ser.o, dd, CM)});
    });
  }
  return [];
}
function rowMetric(r, m){ const v = withDiff(mval(r.t, m)); return v; }

/* ---------- 洞察句子 ---------- */
function sliceLabel(){
  if (S.scope.type && S.scope.vals.length){ const t = S.scope.type, v = S.scope.vals;
    if (t === 'shop') return v.length === 1 ? (D.shops.find(s => s.code === v[0]) || {}).name : v.length+' 間門市';
    return t.toUpperCase()+' '+(v.length === 1 ? v[0] : v.length+' 位'); }
  if (S.slice.type && S.slice.vals.length) return (S.slice.vals.length <= 2 ? S.slice.vals.join(' + ') : S.slice.vals.length+' 個'+(S.slice.type === 'cat' ? '品類' : '會員組別'));
  return '';
}
function renderInsight(X){
  const t = X.t, g = withDiff(mval(t, 'gmv')), o = withDiff(mval(t, 'ord')), b = withDiff(mval(t, 'basket'));
  const who = sliceLabel();
  const perTxt = S.per.from === S.per.to ? dmw(S.per.from) : dm(S.per.from)+'–'+dm(S.per.to);
  let s = `<b>${perTxt}</b>${who ? ' · <b>'+esc(who)+'</b>' : ''} GMV <b>${money(t.g, true)}</b>`;
  if (g.diff != null) s += `，比${cmpName()} <b class="${cls(g.diff)}">${arrow(g.diff)} ${money(Math.abs(g.diff), true)}（${pct(g.pct)}）</b>`;
  s += '。';
  // 拆分：訂單 vs 客單價
  if (o.pct != null && b.pct != null && g.diff){
    const main = Math.abs(o.pct) >= Math.abs(b.pct) ? '訂單數' : '客單價';
    s += ` 主要${g.diff < 0 ? '跌' : '升'}喺<b>${main}</b>（訂單 <span class="${cls(o.pct)}">${pct(o.pct)}</span>、客單價 <span class="${cls(b.pct)}">${pct(b.pct)}</span>）。`;
  }
  // 品類／會員貢獻
  const drv = (dim, label) => {
    const rows = dimRows(dim, X).map(r => Object.assign(r, {v: rowMetric(r, 'gmv')})).filter(r => r.v.diff != null);
    if (!rows.length || !g.diff) return '';
    const same = rows.filter(r => Math.sign(r.v.diff) === Math.sign(g.diff)).sort((a, c) => Math.abs(c.v.diff) - Math.abs(a.v.diff)).slice(0, 2);
    if (!same.length) return '';
    return ` ${label}${g.diff < 0 ? '跌' : '升'}最多：` + same.map(r => `<b>${esc(r.name)}</b>（<span class="${cls(r.v.diff)}">${sgn(r.v.diff, v => money(v, true))}</span>）`).join('、') + '。';
  };
  if (!dimAvail('cat') && !(S.slice.type === 'cat' && S.slice.vals.length === 1)) s += drv('cat', '品類');
  if (!dimAvail('shop') && !(S.scope.type === 'shop' && S.scope.vals.length === 1)){
    const rows = dimRows('shop', X).map(r => Object.assign(r, {v: rowMetric(r, 'gmv')})).filter(r => r.v.diff != null && !r.partial).sort((a, c) => a.v.diff - c.v.diff);
    if (rows.length > 1){ const lo = rows[0], hi = rows[rows.length-1];
      s += ` 門市跌最多：<b>${esc(lo.name)}</b>（<span class="dn">${money(lo.v.diff, true)}</span>）；升最多：<b>${esc(hi.name)}</b>（<span class="${cls(hi.v.diff)}">${sgn(hi.v.diff, v => money(v, true))}</span>）。`; }
  }
  // 提示
  const w = [];
  if (X.perEv.length) w.push('📅 本期包括 '+X.perEv.map(d => EVM[d].n+'（'+dm(d)+'）').join('、')+'，數字可能偏高／偏低。');
  if (!S.exHol && X.cmpEv.length) w.push(`⚠️ 比較期包括 ${X.cmpEv.map(d => EVM[d].n+'（'+dm(d)+'）').join('、')}，會令升跌失真。<button data-act="exhol">改為避開節日</button>`);
  if (S.exHol && X.shifted.length) w.push('ℹ️ 比較基準已避開 '+[...new Set(X.shifted.map(d => EVM[d].n))].join('、')+'，改用再早一星期同一日。');
  if (t.nc < t.n) w.push(`ℹ️ 有 ${t.n - t.nc} 日喺數據開始（${dm(FIRST)}）之前冇得比較，升跌只計 ${t.nc} 日。`);
  if (X.nCov < X.days.length) w.push(X.nCov ? `💰 Discount Cost 只更新到 ${dm(DR.meta.to)}，Cost 同 ROI 只計 ${X.nCov}/${X.days.length} 日。` : `💰 Discount Cost 只更新到 ${dm(DR.meta.to)}，本期未有 Cost／ROI。`);
  $('#secInsight').innerHTML = `<div class="insight"><div class="ic">💡</div><div><p>${s}</p>${w.length ? '<div class="warns">'+w.map(x => '<div class="warn">'+x+'</div>').join('')+'</div>' : ''}</div></div>`;
  const bt = $('#secInsight [data-act="exhol"]'); if (bt) bt.onclick = () => { S.exHol = true; commit(); };
}

/* ---------- KPI ---------- */

/* ---------- 走勢圖 ---------- */
let chart = null;
const css = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
const holPlugin = {
  id:'hol',
  beforeDatasetsDraw(c, a, o){
    const {ctx, chartArea:ca, scales:{x}} = c, days = o.days || [];
    if (!days.length) return;
    const w = (ca.right - ca.left) / Math.max(1, days.length - (days.length > 1 ? 1 : 0));
    ctx.save(); ctx.fillStyle = css('--hol'); ctx.font = '11px sans-serif'; ctx.fillStyle = css('--hol');
    const half = Math.max(8, w/2); let run = [];
    const flush = () => { if (!run.length) return;
      const x0 = x.getPixelForValue(run[0]) - half, x1 = x.getPixelForValue(run[run.length-1]) + half;
      ctx.fillStyle = css('--hol'); ctx.fillRect(x0, ca.top, x1 - x0, ca.bottom - ca.top);
      const nm = run.map(k => EVM[ISO[days[k]]].n).sort((p, q) => p.length - q.length)[0];
      ctx.fillStyle = css('--warn-ink'); ctx.textAlign = 'center'; ctx.fillText(nm, (x0 + x1)/2, ca.top + 12); run = []; };
    days.forEach((i, k) => { if (EVM[ISO[i]] && (!run.length || days[run[run.length-1]] === i - 1)) run.push(k); else { flush(); if (EVM[ISO[i]]) run.push(k); } });
    flush();
    ctx.restore();
  }
};
function renderTrend(X){

    onHover:(e, els) => { e.native.target.style.cursor = els.length ? 'pointer' : 'default'; },
    plugins:{legend:{display:false}, hol:{days},

        title:it => { const i = days[it[0].dataIndex]; return dmw(ISO[i])+(EVM[ISO[i]] ? ' · '+EVM[ISO[i]].n : ''); },
        label:it => { if (it.datasetIndex === 0) return '本期：'+M.f(it.raw);

/* ---------- 拆解（角度選擇器）---------- */

  $('#secBreak').innerHTML = `

      <div class="seg" id="segRank"><button data-r="abs" class="${S.rankBy === 'abs' ? 'on' : ''}">金額</button><button data-r="pct" class="${S.rankBy === 'pct' ? 'on' : ''}">%</button></div></div>
    <div class="hd" style="margin-top:-4px"><span class="lbl">按乜分</span><div class="seg" id="segDim">${dimBtns}</div></div>
    ${note}

function hmColor(v, lo, hi){
  const mid = css('--hm-mid'), pos = css('--hm-pos'), neg = css('--hm-neg');
  const h2r = h => { h = h.replace('#',''); return [0,2,4].map(i => parseInt(h.substr(i,2),16)); };
  const mix = (a, b, t) => a.map((x, i) => Math.round(x + (b[i] - x)*t));

  if (S.pMetric === 'cost'){ t = hi ? Math.min(1, v/hi) : 0; c = mix(h2r(mid), h2r(pos), Math.sqrt(t)); }

  const dimE = effDim(), cols = detailCols(dimE, X), rows = detailRows(dimE, X).sort((a, c) => (c.diff || 0) - (a.diff || 0));
  XLSX.utils.book_append_sheet(wb, sheet([cols.map(c => c.n)].concat(rows.map(r => cols.map(c => { const v = r[c.k]; return typeof v === 'number' ? (['pct','opct'].includes(c.k) ? +v.toFixed(4) : Math.round(v*100)/100) : (v ?? ''); }))), cols.map(c => c.l ? 18 : 13)), DIMS[dimE]);
  if (dimE !== 'shop' && !dimAvail('shop')){
    const sc = detailCols('shop', X), sr = detailRows('shop', X).sort((a, c) => (c.diff || 0) - (a.diff || 0));
    XLSX.utils.book_append_sheet(wb, sheet([sc.map(c => c.n)].concat(sr.map(r => sc.map(c => { const v = r[c.k]; return typeof v === 'number' ? Math.round(v*10000)/10000 : (v ?? ''); }))), sc.map(c => c.l ? 18 : 13)), '門市');
  }
  XLSX.writeFile(wb, `O2O_Review_${S.per.from}_${S.per.to}.xlsx`);
};
function exportPromo(){
  if (!xlsxReady()) return;

    const A = [[x.name], [], [x.cat_label, '推廣前 '+x.before_label].concat(x.dates).concat(['平均'])].concat(x.tableA.map(r => [r.metric, r.before ?? ''].concat(r.vals.map(v => v ?? '')).concat([r.fmt === 'text' ? '' : (r.avg ?? '')])));
    const B = [[], ['推廣日 vs '+(x.baseline_mode || '').replace(' vs ', '')], ['日期', ''].concat(x.dates).concat(['平均'])].concat(x.tableB.map(r => [r.metric, ''].concat(r.vals.map(v => v ?? '')).concat([r.fmt === 'text' ? '' : (r.avg ?? '')])));
    XLSX.utils.book_append_sheet(wb, sheet(A.concat(B), [26, 14].concat(x.dates.map(() => 12)).concat([12])), (x.emoji ? '' : '') + k.slice(0, 28)); });
  XLSX.writeFile(wb, `O2O_Promo_Review_${XL._meta && XL._meta.asof || LAST}.xlsx`);
}

<script>
function b64ToBuf(b64){const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer}
async function deriveKey(pwd,salt,iter){const e=new TextEncoder();const k=await crypto.subtle.importKey('raw',e.encode(pwd),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:iter,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt'])}
async function unlock(){
  const pwd=(document.getElementById('pw').value||'').trim(), err=document.getElementById('err'); err.textContent='';
  try{
    const salt=b64ToBuf(ENC.salt), iv=b64ToBuf(ENC.iv), ct=b64ToBuf(ENC.ct);
    const key=await deriveKey(pwd,salt,ENC.iter);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);
    const P=JSON.parse(new TextDecoder().decode(pt));
    const code='var D='+JSON.stringify(P.D)+';var XL='+JSON.stringify(P.XL)+';var FRESH='+JSON.stringify(P.FRESH)+';var DR='+JSON.stringify(P.DR)+';\n'
      +document.getElementById('appjs').textContent;
    const sc=document.createElement('script'); sc.textContent=code; document.body.appendChild(sc);
    document.body.classList.remove('locked');
    document.getElementById('loginGate').style.display='none';
    sessionStorage.setItem('o2o_v4_pwd',pwd);
  }catch(e){ err.textContent='❌ 密碼錯誤'; }
}
window.addEventListener('DOMContentLoaded',()=>{const p=sessionStorage.getItem('o2o_v4_pwd'); if(p){document.getElementById('pw').value=p; unlock();}});
</script>
